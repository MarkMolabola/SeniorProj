# Copy of the .NET Android SDK's proguard_xamarin.cfg without its -dontobfuscate line, so
# Google Play's DEX obfuscation check passes. The SDK writes its own copy while R8 runs, so
# the ObfuscateAndroidJava target in MDRNJfitness.csproj swaps this one in. Compare it with
# obj/Release/net10.0-android/proguard/proguard_xamarin.cfg after upgrading the Android SDK.
-keep class android.support.multidex.MultiDexApplication { <init>(); }
-keep class net.dot.jni.** { *; <init>(); }
-keep class mono.MonoRuntimeProvider* { *; <init>(...); }
-keep class mono.MonoPackageManager { *; <init>(...); }
-keep class mono.MonoPackageManager_Resources { *; <init>(...); }
-keep class mono.android.** { *; <init>(...); }
-keep class mono.java.** { *; <init>(...); }
-keep class mono.javax.** { *; <init>(...); }
-keep class net.dot.jni.ManagedPeer { *; <init>(...); }
-keep class xamarin.android.net.ServerCertificateCustomValidator_TrustManager { *; <init>(...); }
-keep class xamarin.android.net.ServerCertificateCustomValidator_TrustManager_FakeSSLSession { *; <init>(...); }
-keep class xamarin.android.net.ServerCertificateCustomValidator_AlwaysAcceptingHostnameVerifier { *; <init>(...); }

-keep class android.runtime.** { <init>(...); }
-keep class assembly_mono_android.android.runtime.** { <init>(...); }
# hash for android.runtime and assembly_mono_android.android.runtime.
-keep class md52ce486a14f4bcd95899665e9d932190b.** { *; <init>(...); }
-keepclassmembers class md52ce486a14f4bcd95899665e9d932190b.** { *; <init>(...); }

# .NET runtime
-keep class net.dot.android.crypto.** { *; <init>(...); }

# Android's template misses fluent setters...
-keepclassmembers class * extends android.view.View {
   *** set*(...);
}

# also misses those inflated custom layout stuff from xml...
-keepclassmembers class * extends android.view.View {
   <init>(android.content.Context,android.util.AttributeSet);
   <init>(android.content.Context,android.util.AttributeSet,int);
}
-ignorewarnings
-keepattributes SourceFile
-keepattributes LineNumberTable

# .NET finds Java classes, methods and fields by name at runtime, so renaming one it uses
# crashes the app. Keep everything except packages .NET never references; R8 renames only
# those. After updating NuGet packages, do a Release build and run tools/check_r8_packages.py.
# R8 doesn't rerun when only this file changes, so delete bin/Release and obj/Release first.
-keep class !androidx.annotation.**,!androidx.arch.**,!androidx.browser.browseractions.**,!androidx.browser.trusted.**,!androidx.concurrent.**,!androidx.constraintlayout.**,!androidx.core.animation.**,!androidx.core.content.res.**,!androidx.core.hardware.**,!androidx.core.location.**,!androidx.core.net.**,!androidx.core.provider.**,!androidx.core.telephony.**,!androidx.core.text.util.**,!androidx.core.transition.**,!androidx.dynamicanimation.**,!androidx.emoji2.**,!androidx.exifinterface.**,!androidx.profileinstaller.**,!androidx.slidingpanelayout.**,!androidx.transition.**,!androidx.vectordrawable.**,!androidx.window.**,!com.bumptech.**,!com.google.crypto.tink.aead.**,!com.google.crypto.tink.config.**,!com.google.crypto.tink.daead.**,!com.google.crypto.tink.integration.**,!com.google.crypto.tink.internal.**,!com.google.crypto.tink.mac.**,!com.google.crypto.tink.prf.**,!com.google.crypto.tink.proto.**,!com.google.crypto.tink.streamingaead.**,!com.google.crypto.tink.subtle.**,!com.google.crypto.tink.util.**,!com.google.errorprone.**,!com.google.gson.**,!kotlin.collections.**,!kotlin.comparisons.**,!kotlin.concurrent.**,!kotlin.contracts.**,!kotlin.coroutines.intrinsics.**,!kotlin.coroutines.jvm.**,!kotlin.internal.**,!kotlin.io.**,!kotlin.properties.**,!kotlin.random.**,!kotlin.ranges.**,!kotlin.text.**,!kotlin.time.**,!kotlin.uuid.**,!kotlinx.coroutines.android.**,!kotlinx.coroutines.channels.**,!kotlinx.coroutines.debug.**,!kotlinx.coroutines.flow.internal.**,!kotlinx.coroutines.future.**,!kotlinx.coroutines.internal.**,!kotlinx.coroutines.scheduling.**,!kotlinx.coroutines.selects.**,!kotlinx.coroutines.sync.**,!org.intellij.**,!org.jetbrains.**,** { *; }
